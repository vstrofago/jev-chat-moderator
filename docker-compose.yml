# Vigia on this computer, with Docker:
#
#   docker compose up --build
#
# Then open http://127.0.0.1:7777 and set it up in the browser: where to watch, your Twitch
# app, the Twitch login and your Jev key. The setup code the page asks for is in the logs
# (docker compose logs vigia); it is also the admin code for the dashboard login.
# Only this computer can reach the dashboard and the OBS overlay.
#
# Optional: AI_GATEWAY_API_KEY (or TYPESAFE_API_KEY) and TWITCH_CLIENT_ID in the environment
# fill in those setup steps. To set it up again: docker compose run --rm vigia --setup
# For a VPS with HTTPS, use apps/server/docker-compose.yml. The playground has its own:
# apps/demo/docker-compose.yml.
services:
  vigia:
    image: ghcr.io/vstrofago/vigia:${VIGIA_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      - AI_GATEWAY_API_KEY
      - TYPESAFE_API_KEY
      - TWITCH_CLIENT_ID
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - vigia-data:/data

volumes:
  vigia-data:
