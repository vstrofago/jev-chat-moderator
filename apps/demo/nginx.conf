server {
  listen 8080;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Only the one endpoint the playground uses; the visitor's own key is passed through untouched.
  location = /typesafe-api/v1/systemone {
    proxy_pass https://api.typesafe.ai/v1/systemone;
    proxy_ssl_server_name on;
    proxy_set_header Host api.typesafe.ai;
    proxy_set_header Origin "";
    proxy_read_timeout 30s;
  }
}
