# Vigia on your own VPS, with HTTPS from Caddy.
#
#   export VIGIA_DOMAIN=vigia.example.com      # a domain pointing at this server
#   docker compose -f apps/server/docker-compose.yml up -d           # the released image
#   docker compose -f apps/server/docker-compose.yml up -d --build   # or build from source
#   docker compose -f apps/server/docker-compose.yml logs vigia      # the setup code
#
# Then open https://<your domain> and set Vigia up in the browser with that code (it is also
# the admin code for the dashboard). AI_GATEWAY_API_KEY (or TYPESAFE_API_KEY) and
# TWITCH_CLIENT_ID in the environment are optional: they fill in those setup steps.
services:
  vigia:
    image: ghcr.io/vstrofago/vigia:${VIGIA_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      - AI_GATEWAY_API_KEY
      - TYPESAFE_API_KEY
      - TWITCH_CLIENT_ID
    volumes:
      - vigia-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${VIGIA_DOMAIN:?set VIGIA_DOMAIN} --to vigia:7777
    volumes:
      - caddy-data:/data

volumes:
  vigia-data:
  caddy-data:
