name: Release

# Push a tag like v1.2.3 (matching apps/desktop/package.json). The desktop apps and the
# server image are built into a draft, which is published as a PRE-RELEASE only once every
# build succeeded: while Vigia is experimental, no release is marked "latest".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Checks the tag, runs the tests once, and creates the draft the three builds upload to
  # (so they don't race to create it).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: v
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          cat > notes.md <<'NOTES'
          > [!WARNING]
          > **Experimental, work in progress.** Expect bugs and breaking changes. Start in observe mode, and don't make Vigia your only moderation yet. "My channel" has not been tested with a real Twitch account yet.
          >
          > **Experimental, en desarrollo.** Espera errores y cambios que rompan cosas. Empieza en modo observación, y no uses Vigia como tu única moderación todavía. "Mi canal" todavía no se ha probado con una cuenta real de Twitch.

          **Install:** Windows `Vigia-*-win-x64.exe` (unsigned: *More info → Run anyway*), macOS `.dmg` (unsigned: right-click → *Open*), Linux `.AppImage` (`chmod +x`). Server: `docker pull IMAGE_REF`, or `docker compose up` from the repository.
          NOTES
          sed -i "s|IMAGE_REF|ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vigia:${GITHUB_REF_NAME#v}|" notes.md
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "Vigia $GITHUB_REF_NAME (experimental)" --notes-file notes.md --generate-notes

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the UI, bundles the app and uploads the installer to the draft release.
      - run: pnpm --filter @vigia/desktop run dist --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid Apple certificate: the macOS build is unsigned (see the README).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  server-image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vigia" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MIT

  # Every build made it: publish the draft, as a pre-release.
  publish:
    needs: [desktop, server-image]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
