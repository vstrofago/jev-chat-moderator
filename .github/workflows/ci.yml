name: CI

on:
  push:
    branches-ignore: [main]   # main runs the same checks in deploy.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @vigia/ui build
      - run: pnpm --filter @vigia/demo build
      - run: pnpm --filter @vigia/docs build

      # Boots the desktop app under Xvfb: the setup page, then the dashboard on a read-only source.
      - name: Desktop smoke run
        working-directory: apps/desktop
        run: |
          node build.mjs
          mkdir -p smoke
          # Ubuntu runners block Chromium's user-namespace sandbox.
          VIGIA_SMOKE=1 VIGIA_SMOKE_OUT=smoke xvfb-run -a pnpm exec electron --no-sandbox .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: apps/desktop/smoke/*.png
          if-no-files-found: ignore

  # The real app in a browser: the web setup flow, the dashboard and the OBS overlay.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vigia/ui build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # The server image builds and starts with no configuration, showing the setup page.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: vigia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The container starts and serves the setup page
        run: |
          docker run -d --name vigia -p 127.0.0.1:7777:7777 vigia:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7777/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:7777/health | grep -q '"setup":true'
          curl -sf http://127.0.0.1:7777/ | grep -q 'id="app"'
          docker logs vigia 2>&1 | grep -q "Setup code:"
      - name: Logs
        if: always()
        run: docker logs vigia 2>&1 | tail -40 || true
